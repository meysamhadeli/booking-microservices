name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'assets/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore woo.slnx
      - name: Build
        run: dotnet build woo.slnx --no-restore --configuration Release
