name: Release Drafter

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Update release draft
        id: drafter
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add direct Conventional Commits
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          DRAFT_RELEASE_ID: ${{ steps.drafter.outputs.id }}
        with:
          script: |
            const draftReleaseId = Number(process.env.DRAFT_RELEASE_ID);
            if (!Number.isInteger(draftReleaseId) || draftReleaseId <= 0) {
              core.setFailed('Release Drafter did not return a draft release ID.');
              return;
            }

            const draftResponse = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: draftReleaseId
            });
            const draft = draftResponse.data;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const previousRelease = releases.find(release => !release.draft && !release.prerelease);
            if (!previousRelease) {
              core.info('No published release exists yet; skipping direct commit collection.');
              return;
            }

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${previousRelease.tag_name}...${context.sha}`,
              per_page: 100
            });
            const directCommits = [];
            for (const commit of comparison.data.commits) {
              const pullRequests = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: commit.sha,
                per_page: 100
              });
              if (pullRequests.data.length > 0) continue;

              const subject = commit.commit.message.split('\n')[0].trim();
              const match = subject.match(/^([a-z]+)(?:\([^)]*\))?!?:\s*(.+)$/i);
              const type = match?.[1].toLowerCase() ?? 'other';
              const description = match?.[2] ?? subject;
              const author = commit.author?.login || commit.commit.author?.name || 'unknown';
              const category = {
                feat: '🚀 Features',
                fix: '🐛 Bug Fixes',
                perf: '🐛 Bug Fixes',
                refactor: '♻️ Refactor',
                chore: '🧰 Maintenance',
                build: '🧰 Maintenance',
                ci: '🧰 Maintenance',
                test: '🧪 Test',
                docs: '📝 Other changes',
                style: '📝 Other changes',
                revert: '📝 Other changes'
              }[type] || '📝 Other changes';
              directCommits.push({
                category,
                line: `- ${type}: ${description} @${author}`
              });
            }

            let body = draft.body || '';
            body = body.replace(/<!-- codemap:direct-commit:[^>]+ -->\r?\n- [^\r\n]*(?:\r?\n|$)/g, '');
            for (const commit of directCommits) {
              body = body.replace(`${commit.line}\n`, '');
            }
            const grouped = new Map();
            for (const commit of directCommits) {
              if (!grouped.has(commit.category)) grouped.set(commit.category, []);
              grouped.get(commit.category).push(commit.line);
            }
            for (const [category, lines] of grouped.entries()) {
              const uniqueLines = [...new Set(lines)];
              const heading = `## ${category}`;
              const headingIndex = body.indexOf(heading);
              if (headingIndex >= 0) {
                const nextHeadingIndex = body.indexOf('\n## ', headingIndex + heading.length);
                const changelogIndex = body.indexOf('**Full Changelog**', headingIndex + heading.length);
                const boundaries = [nextHeadingIndex, changelogIndex].filter(index => index >= 0);
                const insertionIndex = boundaries.length > 0 ? Math.min(...boundaries) : body.length;
                const before = body.slice(0, insertionIndex).replace(/\s*$/, '\n\n');
                const after = body.slice(insertionIndex).replace(/^\s*/, '');
                body = `${before}${uniqueLines.join('\n')}\n\n${after}`;
              } else {
                const changelogIndex = body.indexOf('**Full Changelog**');
                const section = `${heading}\n\n${uniqueLines.join('\n')}\n\n`;
                body = changelogIndex >= 0
                  ? `${body.slice(0, changelogIndex)}${section}${body.slice(changelogIndex)}`
                  : `${body.trimEnd()}\n\n${section}`;
              }
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: draft.id,
              body
            });