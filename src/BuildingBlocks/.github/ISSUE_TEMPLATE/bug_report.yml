name: Bug report
description: Report a reproducible problem in a Woo library.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Please provide enough detail to reproduce the issue in a clean consumer project.
  - type: input
    id: module
    attributes:
      label: Module
      description: Which src module is affected?
      placeholder: src/EFCore
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code or repository that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package or commit version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Build or runtime output
      render: shell
